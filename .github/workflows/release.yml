name: Release

# Push a tag like v1.0.1 to publish a release. The Marketplace reads the files from the latest
# release first, and it only downloads the file named in hacs.json, so the one bundled file is attached.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build and syntax check
        run: |
          node scripts/build.mjs
          cp dist/nevvyn-cards.js "$RUNNER_TEMP/check.mjs"
          node --check "$RUNNER_TEMP/check.mjs"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/nevvyn-cards.js
