name: Release

# Push a tag like v1.0.1 to publish a release. The Marketplace reads the files from the latest
# release first, so every file in dist must be attached.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: |
          for f in dist/*.js; do
            cp "$f" "$RUNNER_TEMP/check.mjs"
            node --check "$RUNNER_TEMP/check.mjs"
          done
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/nevvyn-cards.js
            dist/control-panel-card.js
            dist/victron-ess-card.js
            dist/sun-day-card.js
